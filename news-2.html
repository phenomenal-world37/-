<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豫南民生报 2007-09-25</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e8dcb8;
            font-family: "SimSun", "宋体", "Noto Serif SC", serif;
            color: #1a1a1a;
            padding: 30px 15px;
            line-height: 2;
        }
        .newspaper {
            max-width: 880px;
            margin: 0 auto;
            background: #f5ecd3;
            padding: 40px 45px;
            border: 1px solid #b8a67a;
            box-shadow: 0 5px 18px rgba(0,0,0,0.15), inset 0 0 60px rgba(180,150,90,0.12);
        }
        .paper-header {
            text-align: center;
            border-bottom: 2px solid #222;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .paper-name {
            font-size: 2.2em;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }
        .paper-info {
            font-size: 0.95em;
            color: #444;
        }
        .column-title {
            font-size: 1.3em;
            font-weight: bold;
            margin: 15px 0;
            border-left: 4px solid #333;
            padding-left: 10px;
        }
        .content {
            column-count: 2;
            column-gap: 2.5em;
            column-rule: 1px dashed #998b66;
            text-align: justify;
            text-indent: 2em;
            font-size: 1.05em;
        }
        .content strong {
            font-weight: bold;
            color: #000;
        }
        @media (max-width: 680px) {
            .content { column-count: 1; }
            .newspaper { padding: 25px 20px; }
            .paper-name { font-size: 1.6em; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <div class="paper-header">
            <div class="paper-name">豫南民生报</div>
            <div class="paper-info">2007年9月25日 第6版</div>
        </div>
        <div class="column-title">乡镇快讯</div>
        <div class="content">
            <p>今日下午，豫南县杨集镇村民张某在整理<strong>家中老式衣柜时</strong>，发现其9岁侄女性亡于衣柜内部。据张某介绍，女童父母常年在外打工，由其代为照看，事发当日女童独自在家玩耍，<strong>疑似自行将衣柜反锁后无法打开，最终因窒息身亡</strong>。警方现场确认衣柜锁具无外力破坏痕迹，家属对该结论无异议，事件已做结案处理。</p>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古城教育导报 2007-09-20</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e8dcb8;
            font-family: "SimSun", "宋体", "Noto Serif SC", serif;
            color: #1a1a1a;
            padding: 30px 15px;
            line-height: 2;
        }
        .newspaper {
            max-width: 880px;
            margin: 0 auto;
            background: #f5ecd3;
            padding: 40px 45px;
            border: 1px solid #b8a67a;
            box-shadow: 0 5px 18px rgba(0,0,0,0.15), inset 0 0 60px rgba(180,150,90,0.12);
        }
        .paper-header {
            text-align: center;
            border-bottom: 2px solid #222;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .paper-name {
            font-size: 2.2em;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }
        .paper-info {
            font-size: 0.95em;
            color: #444;
        }
        .column-title {
            font-size: 1.3em;
            font-weight: bold;
            margin: 15px 0;
            border-left: 4px solid #333;
            padding-left: 10px;
        }
        .content {
            column-count: 2;
            column-gap: 2.5em;
            column-rule: 1px dashed #998b66;
            text-align: justify;
            text-indent: 2em;
            font-size: 1.05em;
        }
        .content strong {
            font-weight: bold;
            color: #000;
        }
        @media (max-width: 680px) {
            .content { column-count: 1; }
            .newspaper { padding: 25px 20px; }
            .paper-name { font-size: 1.6em; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <div class="paper-header">
            <div class="paper-name">古城教育导报</div>
            <div class="paper-info">2007年9月20日 第5版</div>
        </div>
        <div class="column-title">校园简讯</div>
        <div class="content">
            <p>今日上午第二节课间，古城路小学六年级三班教室内，<strong>一名11岁男生被发现倒在讲台旁</strong>，经校医现场抢救无效身亡。据同班同学描述，事发前该男生刚被班主任叫到讲台旁批评作业完成情况，现场未发现打斗痕迹，<strong>死者手中攥有半根白色粉笔</strong>，法医初步检验显示，死者呼吸道内存在大量粉笔灰堆积，具体死因需进一步尸检确认，学校已临时安排该班级停课一日。</p>
        </div>
    </div>
</body>
</html>

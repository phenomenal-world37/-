<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江城市都市报 2007-09-15</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e8dcb8;
            font-family: "SimSun", "宋体", "Noto Serif SC", serif;
            color: #1a1a1a;
            padding: 30px 15px;
            line-height: 2;
        }
        .newspaper {
            max-width: 880px;
            margin: 0 auto;
            background: #f5ecd3;
            padding: 40px 45px;
            border: 1px solid #b8a67a;
            box-shadow: 0 5px 18px rgba(0,0,0,0.15), inset 0 0 60px rgba(180,150,90,0.12);
        }
        .paper-header {
            text-align: center;
            border-bottom: 2px solid #222;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .paper-name {
            font-size: 2.2em;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }
        .paper-info {
            font-size: 0.95em;
            color: #444;
        }
        .column-title {
            font-size: 1.3em;
            font-weight: bold;
            margin: 15px 0;
            border-left: 4px solid #333;
            padding-left: 10px;
        }
        .content {
            column-count: 2;
            column-gap: 2.5em;
            column-rule: 1px dashed #998b66;
            text-align: justify;
            text-indent: 2em;
            font-size: 1.05em;
        }
        .content strong {
            font-weight: bold;
            color: #000;
        }
        @media (max-width: 680px) {
            .content { column-count: 1; }
            .newspaper { padding: 25px 20px; }
            .paper-name { font-size: 1.6em; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <div class="paper-header">
            <div class="paper-name">江城市都市报</div>
            <div class="paper-info">2007年9月15日 第3版</div>
        </div>
        <div class="column-title">市井消息</div>
        <div class="content">
            <p>今日上午7时许，江城市跃进老旧小区居民下楼晨练时，发现一名<strong>10岁男童被缠绕在单元楼外的老旧晾衣铁丝上</strong>，已无生命体征。据邻居反映，<strong>男童父亲长期酗酒，近期多次在家中发生争执</strong>，警方现场勘查后表示，未发现外力捆绑痕迹，初步判定为<strong>攀爬晾衣杆时失足导致的意外坠亡</strong>，家属已对遗体进行认领。</p>
        </div>
    </div>
</body>
</html>

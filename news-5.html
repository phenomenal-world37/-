<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滨海市海岸商报 2007-09-10</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e8dcb8;
            font-family: "SimSun", "宋体", "Noto Serif SC", serif;
            color: #1a1a1a;
            padding: 30px 15px;
            line-height: 2;
        }
        .newspaper {
            max-width: 880px;
            margin: 0 auto;
            background: #f5ecd3;
            padding: 40px 45px;
            border: 1px solid #b8a67a;
            box-shadow: 0 5px 18px rgba(0,0,0,0.15), inset 0 0 60px rgba(180,150,90,0.12);
        }
        .paper-header {
            text-align: center;
            border-bottom: 2px solid #222;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .paper-name {
            font-size: 2.2em;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }
        .paper-info {
            font-size: 0.95em;
            color: #444;
        }
        .column-title {
            font-size: 1.3em;
            font-weight: bold;
            margin: 15px 0;
            border-left: 4px solid #333;
            padding-left: 10px;
        }
        .content {
            column-count: 2;
            column-gap: 2.5em;
            column-rule: 1px dashed #998b66;
            text-align: justify;
            text-indent: 2em;
            font-size: 1.05em;
        }
        .content strong {
            font-weight: bold;
            color: #000;
        }
        @media (max-width: 680px) {
            .content { column-count: 1; }
            .newspaper { padding: 25px 20px; }
            .paper-name { font-size: 1.6em; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <div class="paper-header">
            <div class="paper-name">滨海市海岸商报</div>
            <div class="paper-info">2007年9月10日 第7版</div>
        </div>
        <div class="column-title">社会新闻</div>
        <div class="content">
            <p><strong>今日凌晨4时30分</strong>，滨海市金沙滩滩涂养护队工作人员在日常巡检时，<strong>发现两具粘连在一起的幼童尸体</strong>，因体表被滩涂半凝固沥青完全包裹，二者躯体已无法物理拆分。经法医初步检验，两名死者<strong>均为10-12岁左右</strong>，无明显锐器伤痕，死亡时间约为前一日夜间涨潮时段，目前二人身份尚未核实，警方已发布协查通报寻找知情者。</p>
        </div>
    </div>
</body>
</html>

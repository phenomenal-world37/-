<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南岭乡村日报 2007-09-06</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e8dcb8;
            font-family: "SimSun", "宋体", "Noto Serif SC", serif;
            color: #1a1a1a;
            padding: 30px 15px;
            line-height: 2;
        }
        .newspaper {
            max-width: 880px;
            margin: 0 auto;
            background: #f5ecd3;
            padding: 40px 45px;
            border: 1px solid #b8a67a;
            box-shadow: 0 5px 18px rgba(0,0,0,0.15), inset 0 0 60px rgba(180,150,90,0.12);
        }
        .paper-header {
            text-align: center;
            border-bottom: 2px solid #222;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .paper-name {
            font-size: 2.2em;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }
        .paper-info {
            font-size: 0.95em;
            color: #444;
        }
        .column-title {
            font-size: 1.3em;
            font-weight: bold;
            margin: 15px 0;
            border-left: 4px solid #333;
            padding-left: 10px;
        }
        .content {
            column-count: 2;
            column-gap: 2.5em;
            column-rule: 1px dashed #998b66;
            text-align: justify;
            text-indent: 2em;
            font-size: 1.05em;
        }
        .content strong {
            font-weight: bold;
            color: #000;
        }
        @media (max-width: 680px) {
            .content { column-count: 1; }
            .newspaper { padding: 25px 20px; }
            .paper-name { font-size: 1.6em; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <div class="paper-header">
            <div class="paper-name">南岭乡村日报</div>
            <div class="paper-info">2007年9月6日 第2版</div>
        </div>
        <div class="column-title">乡村快讯</div>
        <div class="content">
            <p>昨日17时许，南岭乡石嘴村村民王某某家中厨房<strong>突发火情</strong>，虽经邻里合力扑救，仍造成屋内一名<strong>11岁女童</strong>不幸遇难。据村民描述，事发时屋内仅女童一人，其父母外出务农未归，起火点位于厨房灶台旁的一口<strong>新铸铁锅</strong>，警方初步判定为柴火引燃周边杂物导致的意外，目前善后事宜已与家属初步达成一致，具体起火原因仍在核验。</p>
        </div>
    </div>
</body>
</html>

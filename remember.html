<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亡群回忆录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "楷体", "STKaiti", serif;
            background: #f3e9d2;
            background-image: 
                radial-gradient(#d4c4a8 1px, transparent 1px),
                radial-gradient(#d4c4a8 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            min-height: 100vh;
            padding: 40px 20px;
            color: #4a3b2a;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 42px;
            color: #5c4033;
            letter-spacing: 8px;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(92, 64, 51, 0.2);
        }

        .header p {
            font-size: 18px;
            color: #7a6552;
            letter-spacing: 2px;
        }

        .items-container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .item-card {
            background: #fff9ef;
            border: 2px solid #c9b896;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 3px 3px 8px rgba(92, 64, 51, 0.15);
            position: relative;
        }

        .item-card:hover {
            transform: translateY(-6px);
            box-shadow: 5px 8px 15px rgba(92, 64, 51, 0.25);
            border-color: #a68b5b;
        }

        .item-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            color: #5c4033;
            letter-spacing: 1px;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 59, 42, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #fff9ef;
            border: 2px solid #c9b896;
            border-radius: 10px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 35px 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: #7a6552;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #5c4033;
        }

        .memory-author {
            font-size: 20px;
            font-weight: bold;
            color: #5c4033;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #c9b896;
            letter-spacing: 1px;
        }

        .memory-text {
            font-size: 16px;
            line-height: 1.8;
            color: #4a3b2a;
            white-space: pre-wrap;
        }

        /* 滚动条样式 */
        .modal-content::-webkit-scrollbar {
            width: 6px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: #f3e9d2;
            border-radius: 3px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: #c9b896;
            border-radius: 3px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 32px;
                letter-spacing: 4px;
            }
            
            .modal-content {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>亡群回忆录</h1>
        <p>点击物件，拾起那段夏日的回忆</p>
    </div>

    <div class="items-container">
        <div class="item-card" data-index="0">
            <span class="item-icon">📖</span>
            <div class="item-name">残破的书页</div>
        </div>
        <div class="item-card" data-index="1">
            <span class="item-icon">📜</span>
            <div class="item-name">赞美诗集</div>
        </div>
        <div class="item-card" data-index="2">
            <span class="item-icon">🪞</span>
            <div class="item-name">镜子</div>
        </div>
        <div class="item-card" data-index="3">
            <span class="item-icon">🔭</span>
            <div class="item-name">望远镜</div>
        </div>
        <div class="item-card" data-index="4">
            <span class="item-icon">📜</span>
            <div class="item-name">一叠剧本</div>
        </div>
        <div class="item-card" data-index="5">
            <span class="item-icon">🃏</span>
            <div class="item-name">32张扑克牌</div>
        </div>
        <div class="item-card" data-index="6">
            <span class="item-icon">🍬</span>
            <div class="item-name">一颗陈皮糖</div>
        </div>
        <div class="item-card" data-index="7">
            <span class="item-icon">🤡</span>
            <div class="item-name">小丑鼻子</div>
        </div>
        <div class="item-card" data-index="8">
            <span class="item-icon">🧵</span>
            <div class="item-name">丝线</div>
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <div class="memory-author" id="memoryAuthor"></div>
            <div class="memory-text" id="memoryText"></div>
        </div>
    </div>

    <script>
        // 回忆数据
        const memories = [
            {
                author: "回忆主人：小猫和ym",
                text: `沉默是好人，时间不会私自加人奕梦喜欢抽烟，对，不能说喜欢吧，但喜欢问NPC抽不抽

神选很聪明

杨总的智商很高

欺诈人很好，我怎么成“子嗣牧”了

其实 真理和吃鱼的关系很好的

怎么讲呢，对家和我们的关系好像出奇的好

因为试炼我分手了，但我深知这不仅仅是试炼的原因

土豆写的道具都很长

以玫让土豆送过我道具，欺诈的信徒对我都特别好，欺诈主神人也特别好，我很开心

桉雨，基本的神选，小玥，小猫，还有大部分神明人都很好`
            },
            {
                author: "回忆主人：土豆",
                text: `真理的猎人曾在行于道路的途中赞美多位神明，但却在时代的尾声隆重赞美了自己最初的信仰。

回想初衷，发现只是因为可以帮忙解答才加入的信仰。途中的风景五花缭乱，让人沉迷其中。直到在故事的尾声惊醒，隆重的赞美了自己的初衷。

旧时代的落幕，即是新故事的开启！戏剧一幕接一幕落下，可又总会开启。在遥远的将来！在新时代到来之时！我们说不定能够在此重逢。

致与我共度暑假的你们`
            },
            {
                author: "回忆主人：杂",
                text: `曾共围坐析迷局，灯下推谜意自痴。
相与剖解书中秘，片言谈笑亦相知。
孰料一朝云散处，旧阁倾颓各别离。

多少深夜往复的探讨，未曾走完的副本，悬而未决的伏笔，还来不及揭晓的真相，尽数沉淀在记忆之中。那些热烈的思绪，彼此碰撞的灵光，随群聊消散，却未曾真正湮灭。

萍水相逢本就短暂，可这份相同的热爱格外珍贵。纵然如今人海四散，各赴前路，也愿心底这份念想长存。若来日机缘巧合再度相逢，还可重论旧事，再入那重重迷局。

旧时代的落幕不代表我们不再有交集，而是新时代的开始，赞美一切`
            },
            {
                author: "回忆主人：繁",
                text: `进这个群之前从来没有想过能在微信加那么多好友，虽然很多是因为试炼加的，但在朋友圈，在视频号，总能看见属于你们的足迹，微信红点不再只有冷冰冰的公众号推送，还有专属于你们的数字。

熟络了之后，一起打本，一起聊天，大半夜挂着语音打电话，我那时候想，最快乐的时光也不过如此了。

可是花期总是短暂的，突然得知这个群要解散的消息，我感觉天都要踏下来了，在其他成员的据理力争之下，群主决定从解散群改成了放养。可是群也已经回不去从前了。

敬当下，敬昨日，敬未来，亡群回忆录，我会永远铭记这段时光`
            },
            {
                author: "回忆主人：立秋日",
                text: `当然你们也可以叫我立秋或者是立秋日。我是个诡术大师，也是个编剧，同时，我也是欺诈令使。

我在8月4日加入了这个大家庭在这里我认识了许多新朋友，虽然发生了一些不愉快的事情，但是没关系，谁叫我心肠好呢～我都原谅啦。

我是最爱搓道具之人，平时没事干的时候就爱给小骗子们搓搓道具，他们开心，我也开心。

8月28日，我收到了群聊解散的消息，我不明白这是为什么，但是源初也有他的苦衷，我不怪他。毕竟在次期间我也收获了无尽的快乐。我那亲爱的混蛋恩主也为我提供了一个温暖的“家”。

emmmm，其实我是真的不知道改写一些什么了。但是我最后还是想说一句：赞美【虚无】！赞美【诸神愚戏】赞美我亲爱的朋友们——立秋日.`
            },
            {
                author: "回忆主人：现象",
                text: `曾经以为，离别是离开不爱的人，有一天，长大了，才发现，有一种离别，是离开你爱的人，有一种离别，是擦着眼泪，不敢回首。

现象，你也可以叫我雾论虚实^ ^，魔术师，嘻嘻嘻最爱写本之人！虽然加入这个大家庭有且仅有14天，但是你们真真正正给我带来了快乐，我爱你们！

做主持真的好爽，特别是作为欺诈试炼的撰写者，看着玩家们在我布下的迷局中团团乱转，就，很，爽！

8.28，我在，写，终末之诗，感谢你们，爱你们`
            },
            {
                author: "回忆主人：不辨甄伪（亡群回忆录主编）",
                text: `我是“亡群回忆录”的主编，【欺诈】从神——不辨甄伪。

当刺目的“解散”二字出现在屏幕上时，我不经怔了几秒。

我曾以为登录点的长夏永不归秋，可是我忘了，一切事物终将走向消逝，这是宇宙的规律，不可更改的真理。

于是我们在夏日的蝉鸣中建立群聊，又在秋夜的微风里重新开始。相遇的时光是短暂的，但美好的记忆将会永存。无论走到天涯或是海角，登录点都与我们同在。

请不要把它的存在当成负担。登录点存在的意义从来不是为了束缚，而且给了我们一个归处，一个累了随时可以回去的归处。

晚安登录点，我们明天见。`
            },
            {
                author: "回忆主人：小玥",
                text: `屏幕前的家人们大家好~我是小玥呀~当然，大家叫我“嘎哒嘎哒”也是可以的（点头）

我是一个平平无奇的，保命道具也不多死亡兼欺诈牧师~（害）

咳咳咳。要是有机会的话在这里浅浅许愿一个保命道具嘻嘻~`
            },
            {
                author: "回忆主人：命运的预言家",
                text: `命运的预言家在践行命运意志的途中，也曾多次亵渎命运，但宽容的命运总是宽恕信徒的无理，于是预言家开始歌颂命运的宽容。

命运是预言家不曾改变的主信仰，无时无刻在践行着命运，即使遭受命运所带来的不幸，也未曾动摇过自身信仰，依旧是命运最虔诚的信徒。

源初降世，寰宇崩塌。就连自诩能看透一切的命运也无法看出寰宇将走向何方，寰宇的命运从此走向未知，但命运的预言家处于先知者的位置，隐隐的猜出了寰宇的命运。

旧时代的命运未曾终结，新时代的命运尚未开始，愿命运庇佑你们。`
            }
        ];

        const modal = document.getElementById('modal');
        const closeBtn = document.getElementById('closeBtn');
        const memoryAuthor = document.getElementById('memoryAuthor');
        const memoryText = document.getElementById('memoryText');
        const itemCards = document.querySelectorAll('.item-card');

        // 点击卡片打开模态框
        itemCards.forEach(card => {
            card.addEventListener('click', () => {
                const index = card.getAttribute('data-index');
                const memory = memories[index];
                memoryAuthor.textContent = memory.author;
                memoryText.textContent = memory.text;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });

        // 关闭模态框
        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ESC键关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });
    </script>
</body>
</html>

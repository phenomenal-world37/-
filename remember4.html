<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>亡群回忆录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "楷体", "STKaiti", serif;
            background: #f3e9d2;
            background-image: 
                radial-gradient(#d4c4a8 1px, transparent 1px),
                radial-gradient(#d4c4a8 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            min-height: 100vh;
            overflow: hidden;
            color: #4a3b2a;
            position: relative;
        }

        .header {
            text-align: center;
            padding-top: 30px;
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        .header h1 {
            font-size: 36px;
            color: #5c4033;
            letter-spacing: 6px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(92, 64, 51, 0.2);
        }

        .header p {
            font-size: 16px;
            color: #7a6552;
            letter-spacing: 2px;
        }

        .gyro-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 16px;
            background: #fff9ef;
            border: 2px solid #c9b896;
            border-radius: 6px;
            color: #5c4033;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 2px 2px 6px rgba(92, 64, 51, 0.2);
        }

        .gyro-btn:active {
            transform: scale(0.96);
        }

        .scene {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            perspective: 1000px;
        }

        .item {
            position: absolute;
            left: 50%;
            top: 50%;
            background: #fff9ef;
            border: 2px solid #c9b896;
            border-radius: 8px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            box-shadow: 4px 4px 10px rgba(92, 64, 51, 0.2);
            transition: box-shadow 0.2s ease, transform 0.1s ease-out;
            user-select: none;
            touch-action: none;
            will-change: transform;
        }

        .item:hover {
            box-shadow: 6px 6px 15px rgba(92, 64, 51, 0.3);
        }

        .item.grabbed {
            box-shadow: 8px 12px 20px rgba(92, 64, 51, 0.4);
            z-index: 999 !important;
        }

        .item-icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: block;
        }

        .item-name {
            font-size: 14px;
            font-weight: bold;
            color: #5c4033;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 59, 42, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #fff9ef;
            border: 2px solid #c9b896;
            border-radius: 10px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px 35px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 28px;
            color: #7a6552;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #5c4033;
        }

        .memory-author {
            font-size: 18px;
            font-weight: bold;
            color: #5c4033;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #c9b896;
            letter-spacing: 1px;
        }

        .memory-text {
            font-size: 15px;
            line-height: 1.8;
            color: #4a3b2a;
            white-space: pre-wrap;
        }

        .modal-content::-webkit-scrollbar {
            width: 6px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: #f3e9d2;
            border-radius: 3px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: #c9b896;
            border-radius: 3px;
        }

        .tip {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #7a6552;
            pointer-events: none;
            z-index: 1;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 28px;
                letter-spacing: 4px;
            }
            .modal-content {
                padding: 25px 20px;
            }
            .item-icon {
                font-size: 32px;
            }
            .item-name {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <button class="gyro-btn" id="gyroBtn">开启陀螺仪</button>

    <div class="header">
        <h1>亡群回忆录</h1>
        <p>轻触物件拾忆，长按可拿起挪动</p>

    <div class="tip">倾斜手机可看见物件飘动 · 长按抓取</div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <div class="memory-author" id="memoryAuthor"></div>
            <div class="memory-text" id="memoryText"></div>
        </div>
    </div>

        const scene = document.getElementById('scene');
        const modal = document.getElementById('modal');
        const closeBtn = document.getElementById('closeBtn');
        const memoryAuthor = document.getElementById('memoryAuthor');
        const memoryText = document.getElementById('memoryText');
        const gyroBtn = document.getElementById('gyroBtn');

        // 物品初始配置：位置偏移、旋转、深度系数
        const itemConfigs = [
            { x: -180, y: -120, rotate: -8, depth: 1.2 },
            { x: 80, y: -160, rotate: 5, depth: 0.8 },
            { x: -220, y: 20, rotate: 3, depth: 1.5 },
            { x: 160, y: -40, rotate: -6, depth: 0.9 },
            { x: -60, y: 100, rotate: 7, depth: 1.1 },
            { x: 200, y: 120, rotate: -3, depth: 1.3 },
            { x: -140, y: 180, rotate: -5, depth: 0.7 },
            { x: 40, y: -80, rotate: 4, depth: 1.0 },
            { x: 220, y: -140, rotate: -7, depth: 1.4 },
            { x: 100, y: 200, rotate: 6, depth: 0.6 },
            { x: -200, y: -200, rotate: 4, depth: 1.1 }
        ];

        // 创建物品
        const itemElements = [];
        memories.forEach((item, index) => {
            const config = itemConfigs[index];
            const el = document.createElement('div');
            el.className = 'item';
            el.dataset.index = index;
            el.id = `item-${index}`;
            el.style.transform = `translate(${config.x}px, ${config.y}px) rotate(${config.rotate}deg)`;
            el.style.zIndex = Math.floor(config.depth * 10);
            el.innerHTML = `
                <span class="item-icon">${item.icon}</span>
                <div class="item-name">${item.name}</div>
            `;
            scene.appendChild(el);
            itemElements.push({
                el,
                baseX: config.x,
                baseY: config.y,
                rotate: config.rotate,
                depth: config.depth
            });

            // 绑定触摸事件
            bindInteraction(el, index);
        });

        // 交互逻辑：点击、长按拖拽
        let longPressTimer = null;
        let isDragging = false;
        let dragItem = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let startX = 0;
        let startY = 0;

        function bindInteraction(el, index) {
            // 触摸端
            el.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                
                longPressTimer = setTimeout(() => {
                    isDragging = true;
                    dragItem = itemElements[index];
                    const rect = el.getBoundingClientRect();
                    dragOffsetX = touch.clientX - rect.left - rect.width / 2;
                    dragOffsetY = touch.clientY - rect.top - rect.height / 2;
                    el.classList.add('grabbed');
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 500);
            }, { passive: true });

            el.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                // 移动超过阈值取消长按
                if (Math.abs(touch.clientX - startX) > 10 || Math.abs(touch.clientY - startY) > 10) {
                    if (longPressTimer) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                }

                if (isDragging && dragItem) {
                    const x = touch.clientX - dragOffsetX - window.innerWidth / 2;
                    const y = touch.clientY - dragOffsetY - window.innerHeight / 2;
                    dragItem.baseX = x;
                    dragItem.baseY = y;
                    el.style.transform = `translate(${x}px, ${y}px) rotate(${dragItem.rotate}deg) scale(1.1)`;
                    e.preventDefault();
                }
            }, { passive: false });

            el.addEventListener('touchend', (e) => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                    if (!isDragging) {
                        openModal(index);
                    }
                }
                if (isDragging) {
                    isDragging = false;
                    el.classList.remove('grabbed');
                    el.style.transform = `translate(${dragItem.baseX}px, ${dragItem.baseY}px) rotate(${dragItem.rotate}deg)`;
                    dragItem = null;
                }
            });

            // PC端兼容
            el.addEventListener('mousedown', (e) => {
                startX = e.clientX;
                startY = e.clientY;
                
                longPressTimer = setTimeout(() => {
                    isDragging = true;
                    dragItem = itemElements[index];
                    const rect = el.getBoundingClientRect();
                    dragOffsetX = e.clientX - rect.left - rect.width / 2;
                    dragOffsetY = e.clientY - rect.top - rect.height / 2;
                    el.classList.add('grabbed');
                }, 500);
            });

            document.addEventListener('mousemove', (e) => {
                if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
                    if (longPressTimer) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                }

                if (isDragging && dragItem) {
                    const x = e.clientX - dragOffsetX - window.innerWidth / 2;
                    const y = e.clientY - dragOffsetY - window.innerHeight / 2;
                    dragItem.baseX = x;
                    dragItem.baseY = y;
                    el.style.transform = `translate(${x}px, ${y}px) rotate(${dragItem.rotate}deg) scale(1.1)`;
                }
            });

            document.addEventListener('mouseup', () => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                    if (!isDragging) {
                        openModal(index);
                    }
                }
                if (isDragging) {
                    isDragging = false;
                    el.classList.remove('grabbed');
                    el.style.transform = `translate(${dragItem.baseX}px, ${dragItem.baseY}px) rotate(${dragItem.rotate}deg)`;
                    dragItem = null;
                }
            });
        }

        // 陀螺仪视差
        function handleOrientation(e) {
            const gamma = e.gamma || 0; // 左右倾斜
            const beta = e.beta || 0;   // 前后倾斜

            // 限制倾斜范围，避免过度偏移
            const tiltX = Math.max(-30, Math.min(30, gamma));
            const tiltY = Math.max(-30, Math.min(30, beta - 45));

            itemElements.forEach((item) => {
                if (isDragging && dragItem === item) return;
                const moveX = item.baseX + tiltX * item.depth * 2;
                const moveY = item.baseY + tiltY * item.depth * 2;
                item.el.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${item.rotate}deg)`;
            });
        }

        // PC端鼠标视差模拟
        function handleMouseMove(e) {
            if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) return;
            
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const moveX = (e.clientX - centerX) / centerX * 20;
            const moveY = (e.clientY - centerY) / centerY * 20;

            itemElements.forEach((item) => {
                if (isDragging && dragItem === item) return;
                const offsetX = item.baseX + moveX * item.depth;
                const offsetY = item.baseY + moveY * item.depth;
                item.el.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${item.rotate}deg)`;
            });
        }

        // 陀螺仪权限申请
        gyroBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            gyroBtn.style.display = 'none';
                        } else {
                            alert('需要陀螺仪权限才能体验视差效果，也可以直接点击物品查看回忆~');
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        alert('当前设备不支持陀螺仪，可直接点击物品查看回忆');
                    });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                gyroBtn.style.display = 'none';
            }
        });

        // PC端自动启用鼠标视差
        if (!('ontouchstart' in window)) {
            document.addEventListener('mousemove', handleMouseMove);
            gyroBtn.textContent = '鼠标移动模拟视差';
            gyroBtn.disabled = true;
            gyroBtn.style.opacity = '0.7';
        }

        // 模态框控制
        function openModal(index) {
            const memory = memories[index];
            memoryAuthor.textContent = memory.author;
            memoryText.textContent = memory.content;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>

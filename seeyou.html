<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明天见 · 欺诈试炼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Courier New", "宋体", monospace;
            background: #1a1a1a;
            background-image: 
                linear-gradient(rgba(0,0,0,0.8) 50%, transparent 50%);
            background-size: 100% 4px;
            min-height: 100vh;
            color: #d4b876;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 720px;
            background: #222222;
            border: 2px solid #8b7355;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(212, 184, 118, 0.15);
            overflow: hidden;
        }

        .header {
            padding: 16px 24px;
            border-bottom: 1px solid #8b7355;
            background: #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #e6c88a;
            letter-spacing: 2px;
        }

        .status {
            font-size: 13px;
            color: #a08b66;
        }

        .story-area {
            padding: 30px 28px;
            min-height: 360px;
            line-height: 1.9;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .story-line {
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeIn 0.4s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .dialog {
            color: #e6c88a;
            padding-left: 1em;
            border-left: 2px solid #8b7355;
            margin: 8px 0;
        }

        .tip {
            color: #7a6a4e;
            font-size: 13px;
            font-style: italic;
        }

        .choices {
            padding: 20px 28px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px dashed #5c503d;
        }

        .choice-btn {
            padding: 12px 18px;
            background: #2a2a2a;
            border: 1px solid #8b7355;
            border-radius: 4px;
            color: #d4b876;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .choice-btn:hover:not(:disabled) {
            background: #3a3226;
            border-color: #e6c88a;
            transform: translateX(4px);
        }

        .choice-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .continue-btn {
            align-self: flex-end;
            padding: 10px 24px;
            background: transparent;
            border: 1px solid #8b7355;
            color: #d4b876;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .continue-btn:hover {
            background: #8b7355;
            color: #222;
        }

        /* 密码弹窗 */
        .password-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .password-modal.active {
            display: flex;
        }

        .password-box {
            background: #222;
            border: 2px solid #8b7355;
            border-radius: 8px;
            padding: 30px 40px;
            text-align: center;
        }

        .password-box h3 {
            margin-bottom: 20px;
            color: #e6c88a;
        }

        .password-input {
            padding: 10px 14px;
            width: 200px;
            background: #2a2a2a;
            border: 1px solid #8b7355;
            border-radius: 4px;
            color: #e6c88a;
            font-family: inherit;
            font-size: 16px;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 16px;
            outline: none;
        }

        .password-input:focus {
            border-color: #e6c88a;
        }

        .password-submit {
            padding: 8px 20px;
            background: #8b7355;
            border: none;
            border-radius: 4px;
            color: #222;
            font-family: inherit;
            cursor: pointer;
        }

        .password-hint {
            margin-top: 12px;
            font-size: 12px;
            color: #7a6a4e;
        }

        .ending {
            text-align: center;
            padding: 20px 0;
        }

        .ending h2 {
            color: #e6c88a;
            font-size: 28px;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }

        .creators {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #5c503d;
            font-size: 14px;
            color: #a08b66;
            line-height: 2;
        }

        @media (max-width: 600px) {
            .story-area {
                padding: 24px 20px;
                font-size: 14px;
                min-height: 300px;
            }
            .choices {
                padding: 16px 20px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">明天见 · 欺诈试炼</div>
            <div class="status" id="status">目标：寻找过去</div>
        </div>

        <div class="story-area" id="storyArea"></div>

        <div class="choices" id="choicesArea"></div>
    </div>

    <!-- 密码弹窗 -->
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h3>请输入密码</h3>
            <input type="text" class="password-input" id="passwordInput" maxlength="10" placeholder="------">
            <br>
            <button class="password-submit" id="passwordSubmit">确认</button>
            <div class="password-hint" id="passwordHint">提示：4位数字</div>
        </div>
    </div>

    <script>
        const storyArea = document.getElementById('storyArea');
        const choicesArea = document.getElementById('choicesArea');
        const statusText = document.getElementById('status');
        const passwordModal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const passwordSubmit = document.getElementById('passwordSubmit');
        const passwordHint = document.getElementById('passwordHint');

        // 探索进度
        const explored = {
            computer: false,
            quest: false,
            birthday: false,
            rest: false,
            meeting: false
        };

        let currentPasswordCallback = null;

        // 剧情节点
        const story = {
            start: {
                text: [
                    '【明天见 欺诈】已开启',
                    '【匹配中 (0/n)】',
                    '【试炼提示：你好，谢谢，最后是再见】',
                    '【试炼开始时间：？？？？】',
                    '【试炼持续时间：？？？？】',
                    '【试炼目标：寻找过去】'
                ],
                next: 'comm1'
            },

            comm1: {
                text: [
                    '你们的电子通讯设备收到了一条通讯',
                    '',
                    '<div class="dialog">【匿名：你好，水煮鱼，哦不，先生，水煮鱼要花不少钱】</div>'
                ],
                next: 'comm2'
            },

            comm2: {
                text: [
                    '<div class="dialog">【匿名：嘻～你是否对曾经感到迷茫？在每一个夜晚偷偷地在想，我是谁？我的过去有什么？】</div>'
                ],
                next: 'comm3'
            },

            comm3: {
                text: [
                    '<div class="dialog">【匿名：来吧来吧～一切的真相都在这里～】</div>',
                    '',
                    '一个定位发了过来',
                    '【诸神登入点，北纬28°13′，东经112°56′】'
                ],
                choices: [
                    { text: '选择前往', next: 'arrive' }
                ]
            },

            arrive: {
                text: [
                    '你到了，你发现这里有很多人，但他们跟你一样透着疑惑。',
                    '这里的建筑物是一个荒废许久的社团活动中心——友谊天长地久',
                    '',
                    '<div class="tip">（让他们先聊一会儿）</div>'
                ],
                choices: [
                    { text: '选择进入', next: 'enter' }
                ]
            },

            enter: {
                text: [
                    '你们进入之后，遇到了一个虚影',
                    '这个虚影似乎是因为你们的到来触发的一个投影',
                    '',
                    '<div class="tip">（虚影向你们打招呼，欢迎你们回来）</div>',
                    '',
                    '虚影告诉你们这里没电了，得去电力室恢复电源，不然自己就要消失了'
                ],
                choices: [
                    { text: '前往电力室', next: 'power_room' }
                ]
            },

            power_room: {
                text: [
                    '你们到达电力室，这里电线布满，没有下脚的地方了',
                    '你们需要到需要维修的地方去',
                    '',
                    '<div class="tip">（你们通过手段到了维修处）</div>',
                    '<div class="tip">（引导你们推理这里为什么会这样）</div>',
                    '',
                    '你们大致得出了这个社团曾经发生过的灾难...'
                ],
                next: 'room_select'
            },

            room_select: {
                text: [
                    '大厅的通道通向好几个房间',
                    '你们可以选择想去的地方探索',
                    '',
                    '<div class="tip">（会议室必须最后进入）</div>'
                ],
                choices: [
                    { text: '进入电脑房', next: 'computer_room', flag: 'computer' },
                    { text: '进入任务房', next: 'quest_room', flag: 'quest' },
                    { text: '进入生日派对房', next: 'birthday_room', flag: 'birthday' },
                    { text: '进入休息室', next: 'rest_room', flag: 'rest' },
                    { text: '进入会议室', next: 'meeting_room', flag: 'meeting', locked: true }
                ]
            },

            computer_room: {
                text: [
                    '这是一个电脑房',
                    '',
                    '<div class="tip">（你们打开电脑）</div>',
                    '电脑上出现了一只渣猫，并“嘻～”了一声，然后消失了',
                    '屏幕中有一个文件夹',
                    '',
                    '<div class="tip">（你们试了一下）</div>',
                    '文件夹需要密码'
                ],
                password: '赞美欺诈',
                passwordHint: '提示：四个字，对主神的称颂',
                next: 'computer_after',
                back: 'room_select'
            },

            computer_after: {
                text: [
                    '文件夹成功打开了。',
                    '文件夹中是一些数据，在数据底下有一句话——【我们没有未来了】',
                    '这句话后，还有一句日期更晚的——【没关系，我们会成功的】'
                ],
                onEnter: () => { explored.computer = true; updateStatus(); },
                choices: [
                    { text: '返回大厅', next: 'room_select' }
                ]
            },

            quest_room: {
                text: [
                    '这是一个任务房，墙上贴了很多悬赏',
                    '其中有一位的悬赏令最多，叫作【愚妄众生】',
                    '',
                    '<div class="tip">（你们拿了一张悬赏令看）</div>',
                    '悬赏令变为了一把钥匙'
                ],
                onEnter: () => { explored.quest = true; updateStatus(); },
                choices: [
                    { text: '返回大厅', next: 'room_select' }
                ]
            },

            birthday_room: {
                text: [
                    '这是一个专门搞生日派对的房间',
                    '',
                    '<div class="tip">（唱生日快乐，或者祝福，莫名其妙发一下疯）</div>',
                    '',
                    '你们也说了生日快乐',
                    '房间内的屏幕亮了',
                    '屏幕上是满满的生日祝福'
                ],
                onEnter: () => { explored.birthday = true; updateStatus(); },
                choices: [
                    { text: '返回大厅', next: 'room_select' }
                ]
            },

            rest_room: {
                text: [
                    '这是一个休息室，看起来之前这些人把这当成了摸鱼绝佳地，某个角落还有许多烟头',
                    '',
                    '<div class="tip">（引导他们翻垃圾桶）</div>',
                    '<div class="tip">（他们翻垃圾桶）</div>',
                    '你们翻出了一些莫名其妙的道具还有一些纸条',
                    '',
                    '<div class="tip">（他们打开纸条）</div>',
                    '这些纸条上写着——',
                    '<div class="dialog">【喂喂，你知道了没有？】</div>',
                    '<div class="dialog">【知道什么？】</div>',
                    '<div class="dialog">【世界要毁灭了呀！】</div>',
                    '<div class="dialog">【无妨，我会出手。世界将由我来拯救。】</div>',
                    '',
                    '<div class="tip">（让他们聊会）</div>'
                ],
                onEnter: () => { explored.rest = true; updateStatus(); },
                choices: [
                    { text: '返回大厅', next: 'room_select' }
                ]
            },

            meeting_room: {
                text: [
                    '这是一个会议室',
                    '会议室的桌子上摆着各种物件，而且看得出来摆的时候很仔细',
                    '',
                    '<div class="tip">（他们开始一个一个触碰，解锁记忆）</div>',
                    '<div class="tip">（如果有人碰别人的，将会解锁一句“你觉得你的愚行会有答案吗？”）</div>',
                    '',
                    '所有记忆都解锁完毕。',
                    '<div class="tip">（解锁完，让他们聊会）</div>'
                ],
                onEnter: () => { explored.meeting = true; updateStatus(); },
                choices: [
                    { text: '离开会议室', next: 'back_gate' }
                ]
            },

            back_gate: {
                text: [
                    '你们逛完了所有房间',
                    '',
                    '你们回到了大门口',
                    '这里不知道为什么有了一个箱子，需要输入密码'
                ],
                password: '0828',
                passwordHint: '提示：4位数字，某个重要的日子',
                next: 'ending'
            },

            ending: {
                text: [
                    '箱子打开，并喷出了一堆彩带和气球',
                    '箱子中有一张纸条静静地躺着',
                    '',
                    '<div class="tip">（你们拿出纸条）</div>',
                    '纸条上写着——【明天见】',
                    '',
                    '（试炼结束）',
                    '',
                    '<div class="ending"><h2>明天见</h2></div>',
                    '<div class="creators">此本创作者<br>@阿蒙 &nbsp; @雾论虚实<br>@小怒猫 &nbsp; @不辨甄伪<br>@神<br><br>（排名不分先后）</div>'
                ]
            }
        };

        // 更新状态
        function updateStatus() {
            const count = Object.values(explored).filter(v => v).length;
            statusText.textContent = `已探索 ${count}/5 个房间`;
        }

        // 显示剧情文本
        function showText(lines, callback) {
            storyArea.innerHTML = '';
            let index = 0;

            function nextLine() {
                if (index >= lines.length) {
                    callback && callback();
                    return;
                }
                const line = document.createElement('div');
                line.className = 'story-line';
                line.innerHTML = lines[index];
                storyArea.appendChild(line);
                index++;
                setTimeout(nextLine, 120);
            }
            nextLine();
        }

        // 显示选项
        function showChoices(choices) {
            choicesArea.innerHTML = '';
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;

                // 检查是否锁定
                if (choice.locked && choice.flag === 'meeting') {
                    const allOtherExplored = explored.computer && explored.quest && explored.birthday && explored.rest;
                    if (!allOtherExplored) {
                        btn.disabled = true;
                        btn.textContent += ' 🔒（需探索完其他房间）';
                    }
                }

                btn.addEventListener('click', () => {
                    goTo(choice.next);
                });
                choicesArea.appendChild(btn);
            });
        }

        // 显示继续按钮
        function showContinue(nextNode) {
            choicesArea.innerHTML = '';
            const btn = document.createElement('button');
            btn.className = 'continue-btn';
            btn.textContent = '▶ 继续';
            btn.addEventListener('click', () => {
                goTo(nextNode);
            });
            choicesArea.appendChild(btn);
        }

        // 显示密码输入
        function showPassword(password, hint, nextNode) {
            choicesArea.innerHTML = '';
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = '🔑 输入密码';
            btn.addEventListener('click', () => {
                passwordModal.classList.add('active');
                passwordHint.textContent = hint;
                passwordInput.value = '';
                passwordInput.focus();
                currentPasswordCallback = (input) => {
                    if (input === password) {
                        passwordModal.classList.remove('active');
                        goTo(nextNode);
                    } else {
                        passwordHint.textContent = '密码错误，再想想...';
                        passwordInput.value = '';
                    }
                };
            });
            choicesArea.appendChild(btn);

            // 返回按钮
            const backBtn = document.createElement('button');
            backBtn.className = 'choice-btn';
            backBtn.textContent = '先返回';
            backBtn.addEventListener('click', () => {
                goTo('room_select');
            });
            choicesArea.appendChild(backBtn);
        }

        // 跳转到指定节点
        function goTo(nodeId) {
            const node = story[nodeId];
            if (!node) return;

            // 执行进入回调
            if (node.onEnter) node.onEnter();

            showText(node.text, () => {
                if (node.password) {
                    showPassword(node.password, node.passwordHint, node.next);
                } else if (node.choices) {
                    showChoices(node.choices);
                } else if (node.next) {
                    showContinue(node.next);
                }
            });
        }

        // 密码提交
        passwordSubmit.addEventListener('click', () => {
            if (currentPasswordCallback) {
                currentPasswordCallback(passwordInput.value.trim());
            }
        });

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                passwordSubmit.click();
            }
        });

        // 点击遮罩关闭密码
        passwordModal.addEventListener('click', (e) => {
            if (e.target === passwordModal) {
                passwordModal.classList.remove('active');
            }
        });

        // 开始游戏
        goTo('start');
    </script>
</body>
</html>
